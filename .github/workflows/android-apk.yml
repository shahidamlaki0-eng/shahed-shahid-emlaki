name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip -o ShahedShahidEmalaki_MobileBuild_Stage1.zip

      - name: Build APK
        run: gradle -p ShahedShahidEmalaki assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shahed-Shahid-Emalaki-APK
          path: ShahedShahidEmalaki/app/build/outputs/apk/debug/app-debug.apk
